<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تولید متن رنگ، سن و ابعاد محصول</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Tahoma', Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            direction: rtl;
        }

        .container {
            background-color: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 650px;
            margin: 20px auto;
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 24px;
        }

        .product {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 18px;
            background-color: #f9f9f9;
        }

        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .product-header h3 {
            margin: 0;
            color: #555;
            font-weight: bold;
        }

        .remove-btn {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .remove-btn:hover { background-color: #d32f2f; }

        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        .dimensions-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .dimensions-row > div {
            flex: 1;
        }

        @media (max-width: 480px) {
            .dimensions-row { flex-direction: column; gap: 0; }
        }

        #addProductBtn, button[type="submit"] {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 16px;
        }

        #addProductBtn {
            background-color: #2196F3;
            color: white;
        }

        #addProductBtn:hover { background-color: #1E88E5; }

        button[type="submit"] {
            background-color: #4CAF50;
            color: white;
        }

        button[type="submit"]:hover { background-color: #45a049; }

        #output {
            margin-top: 24px;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 12px;
            border: 2px dashed #ccc;
            white-space: pre-wrap;
            font-size: 1.05rem;
            line-height: 2.2;
            direction: rtl;
            text-align: right;
            min-height: 120px;
            font-family: 'Tahoma', sans-serif;
        }

        .copy-btn {
            margin-top: 12px;
            padding: 12px 20px;
            background-color: #FF9800;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }

        .copy-btn:hover { background-color: #e68900; }
    </style>
</head>
<body>
    <div class="container">
        <h1>تولید متن رنگ، سن و ابعاد محصول</h1>
        
        <form id="inputForm">
            <div id="productsContainer"></div>
            
            <button type="button" id="addProductBtn">+ اضافه کردن رنگ و سن جدید</button>
            
            <button type="submit">تولید متن نهایی</button>
        </form>

        <div id="output"></div>
        <button type="button" class="copy-btn" id="copyBtn" style="display:none;">کپی کردن متن</button>
    </div>

    <script>
        const productsContainer = document.getElementById('productsContainer');
        const output = document.getElementById('output');
        const copyBtn = document.getElementById('copyBtn');
        const addProductBtn = document.getElementById('addProductBtn');
        
        let productCount = 0;

        function addProduct() {
            productCount++;
            const div = document.createElement('div');
            div.className = 'product';
            div.id = `product-${productCount}`;
            
            div.innerHTML = `
                <div class="product-header">
                    <h3>رنگ و سن ${productCount}</h3>
                    <button type="button" class="remove-btn" onclick="removeProduct(${productCount})">حذف</button>
                </div>

                <label>نام رنگ:</label>
                <input type="text" placeholder="مثال: آبی, مشکی, صورتی" required>

                <label>سن یا سایز:</label>
                <input type="text" placeholder="مثال: ۲ سال, ۳-۴ سال, ۶ ماه" required>

                <div class="dimensions-row">
                    <div>
                        <label>عرض (سانتی‌متر):</label>
                        <input type="number" placeholder="مثال: ۷۰" required>
                    </div>
                    <div>
                        <label>طول (سانتی‌متر):</label>
                        <input type="number" placeholder="مثال: ۱۴۰" required>
                    </div>
                </div>
            `;
            productsContainer.appendChild(div);
        }

        function removeProduct(id) {
            document.getElementById(`product-${id}`)?.remove();
        }

        addProduct();

        addProductBtn.addEventListener('click', addProduct);

        document.getElementById('inputForm').addEventListener('submit', function(e) {
            e.preventDefault();

            let text = '';
            const products = document.querySelectorAll('.product');

            products.forEach((product) => {
                const inputs = product.querySelectorAll('input');
                const color = inputs[0].value.trim();
                const age = inputs[1].value.trim();
                const width = inputs[2].value;
                const length = inputs[3].value;

                if (color && age && width && length) {
                    text += `رنگ: ${color}\n`;
                    text += `سن: ${age} سال\n`;
                    text += `ابعاد تقریبی:\n`;
                    text += `- عرض: ${width} سانتی‌متر\n`;
                    text += `- طول: ${length} سانتی‌متر\n\n`;
                    text += `──────────────────\n\n`;
                }
            });

            // جمله پایانی بدون ایموجی
            if (text) {
                text += `لطفاً رنگ و سایز مورد نظر خود را اعلام کنید تا موجودی را بررسی کنیم.`;
                output.textContent = text.trim();
                copyBtn.style.display = 'block';
            } else {
                output.textContent = 'هیچ داده‌ای وارد نشده!';
                copyBtn.style.display = 'none';
            }
        });

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(output.textContent);
            copyBtn.textContent = 'کپی شد!';
            setTimeout(() => copyBtn.textContent = 'کپی کردن متن', 2000);
        });
    </script>
</body>
</html>
