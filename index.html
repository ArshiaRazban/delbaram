<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تولید متن برای محصول</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Tahoma', Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            direction: rtl;
        }

        .container {
            background-color: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px; /* کمی بزرگ‌تر برای چندین محصول */
            margin: 20px auto;
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 24px;
        }

        .product {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            background-color: #f9f9f9;
        }

        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .product-header h3 {
            margin: 0;
            color: #555;
        }

        .remove-btn {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .remove-btn:hover {
            background-color: #d32f2f;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        #addProductBtn {
            width: 100%;
            padding: 12px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        #addProductBtn:hover {
            background-color: #1E88E5;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        button[type="submit"]:hover {
            background-color: #45a049;
        }

        #output {
            margin-top: 24px;
            padding: 16px;
            background-color: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            white-space: pre-wrap;
            font-size: 1rem;
            line-height: 1.8;
            direction: rtl;
            text-align: right;
        }

        /* ریسپانسیو برای صفحه‌های کوچک */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 16px;
                margin: 10px auto;
            }

            h1 {
                font-size: 1.3rem;
            }

            input, button {
                padding: 12px;
                font-size: 1rem;
            }

            #output {
                font-size: 0.95rem;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- <h1>تولید متن تکراری برای چندین محصول</h1> -->
        
        <form id="inputForm">
            <div id="productsContainer">
                <!-- محصولات دینامیک اینجا اضافه می‌شوند -->
            </div>
            
            <button type="button" id="addProductBtn">اضافه کردن محصول جدید</button>
            
            <button type="submit">تولید متن برای محصولات</button>
        </form>

        <div id="output"></div>
    </div>

    <script>
        const form = document.getElementById('inputForm');
        const productsContainer = document.getElementById('productsContainer');
        const output = document.getElementById('output');
        const addProductBtn = document.getElementById('addProductBtn');

        let productCount = 0;

        // تابع برای اضافه کردن یک محصول جدید
        function addProduct() {
            productCount++;
            const productDiv = document.createElement('div');
            productDiv.classList.add('product');
            productDiv.id = `product-${productCount}`;

            productDiv.innerHTML = `
                <div class="product-header">
                    <h3>سایز ${productCount}</h3>
                    <button type="button" class="remove-btn" onclick="removeProduct(${productCount})">حذف</button>
                </div>
                <label for="size-${productCount}">سایز (مثل S، M، L، XL):</label>
                <input type="text" id="size-${productCount}" placeholder="مثال: Medium یا L" required>

                <label for="width-${productCount}">عرض (سانتی‌متر):</label>
                <input type="number" id="width-${productCount}" placeholder="مثال: 50" required>

                <label for="length-${productCount}">طول (سانتی‌متر):</label>
                <input type="number" id="length-${productCount}" placeholder="مثال: 100" required>
            `;

            productsContainer.appendChild(productDiv);
        }

        // تابع برای حذف محصول
        function removeProduct(id) {
            const productDiv = document.getElementById(`product-${id}`);
            if (productDiv) {
                productDiv.remove();
            }
        }

        // اضافه کردن اولین محصول به طور پیش‌فرض
        addProduct();

        // رویداد برای دکمه اضافه کردن محصول
        addProductBtn.addEventListener('click', addProduct);

        // رویداد برای فرم
        form.addEventListener('submit', function(event) {
            event.preventDefault();

            const products = [];
            for (let i = 1; i <= productCount; i++) {
                const sizeInput = document.getElementById(`size-${i}`);
                const widthInput = document.getElementById(`width-${i}`);
                const lengthInput = document.getElementById(`length-${i}`);

                // اگر محصول حذف نشده باشد
                if (sizeInput && widthInput && lengthInput) {
                    const size = sizeInput.value.trim();
                    const width = widthInput.value;
                    const length = lengthInput.value;

                    if (size && width && length) {
                        products.push({ size, width, length });
                    }
                }
            }

            // تولید متن خروجی برای همه محصولات
            let text = 'متن نهایی\n';
            products.forEach((product, index) => {
                text += `سایز: ${product.size}\n`;
                text += `عرض: ${product.width} سانتی‌متر\n`;
                text += `طول: ${product.length} سانتی‌متر\n\n`;
                text += '-------------------------\n\n';
            });

            output.textContent = text;
        });
    </script>
</body>
</html>
